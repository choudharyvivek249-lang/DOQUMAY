databases:
  - name: documay-db
    databaseName: documay
    user: documay_user
    plan: free
    region: oregon

services:
  - type: web
    name: documay
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: documay-db
          property: connectionString

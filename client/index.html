<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5F259F" />
    <title>DoquMay · World's 1st Fastest & Easiest Document Sender</title>
    <meta name="description" content="DoquMay - World's 1st Fastest and Easiest Document Sender. Instant zero-login document and photo sharing by QR code. Inspired by top payment apps, built purely for documents." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234A0E78'/%3E%3Cstop offset='50%25' stop-color='%235F259F'/%3E%3Cstop offset='100%25' stop-color='%231B033A'/%3E%3C/linearGradient%3E%3ClinearGradient id='rib' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300F5A0'/%3E%3Cstop offset='50%25' stop-color='%2300D2FF'/%3E%3Cstop offset='100%25' stop-color='%230066FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='fld' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FFDD00'/%3E%3Cstop offset='100%25' stop-color='%23FF7700'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23bg)'/%3E%3Cpath d='M34 22 h18 c16 0 28 10 28 28 s-12 28 -28 28 H34 c-4.4 0 -8 -3.6 -8 -8 V30 c0 -4.4 3.6 -8 8 -8 z' fill='none' stroke='url(%23rib)' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M36 26 h18 l14 14 v28 c0 3.3 -2.7 6 -6 6 H36 c-3.3 0 -6 -2.7 -6 -6 V32 c0 -3.3 2.7 -6 6 -6 z' fill='%23ffffff'/%3E%3Cpath d='M54 26 v14 h14 z' fill='url(%23fld)'/%3E%3Cline x1='38' y1='48' x2='60' y2='48' stroke='%230066FF' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='38' y1='56' x2='56' y2='56' stroke='%2300D2FF' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='38' y1='64' x2='48' y2='64' stroke='%2300F5A0' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='78' cy='24' r='5' fill='%2300F5A0'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Fast initial loader so screen is never blank while JavaScript bundles mount -->
      <div id="initial-loader" style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: system-ui, -apple-system, sans-serif; color: #6d28d9; background: radial-gradient(120% 90% at 50% -10%, #ede9fe 0%, #ffffff 60%); padding: 20px; box-sizing: border-box;">
        <div style="width: 48px; height: 48px; border: 4px solid #ddd6fe; border-top-color: #7c3aed; border-radius: 50%; animation: dqm-spin 0.8s linear infinite;"></div>
        <b style="font-size: 1.15rem; letter-spacing: -0.01em; color: #1e1b4b;">Loading DoquMay…</b>
        <span style="font-size: 0.82rem; color: #7c3aed; text-align: center; font-weight: 600;">⚡ World’s 1st Fastest &amp; Easiest Document Sender</span>
      </div>
      <style>
        @keyframes dqm-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('initial-loader');
        if (el) {
          el.innerHTML = '<div style="max-width:440px;background:#ffffff;padding:26px 20px;border-radius:22px;border:2px solid #fecaca;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;">' +
            '<span style="font-size:2.4rem;">⚠️</span>' +
            '<h3 style="color:#b91c1c;margin:8px 0;font-size:1.2rem;">Failed to Initialize</h3>' +
            '<p style="color:#6b7280;font-size:0.85rem;margin:6px 0 14px;line-height:1.4;">' + (e.message || 'Script error loading bundle') + '</p>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="background:linear-gradient(135deg,#6366f1 0%,#3b82f6 100%);color:#fff;border:none;padding:12px 24px;border-radius:14px;font-weight:800;font-size:0.92rem;cursor:pointer;">Clear Cache & Reload</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
